<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Pasty</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one centred column. Header (brand, four tabs, theme), then the active view. Identity: gold on warm black or cream, topics numbered 1 to 21 as tiles. */
:root{
  --bg:#0e0c0a; --surface:#171310; --surface-2:#211b16; --line:#33291f;
  --fg:#f1e9dc; --muted:#a69c8c; --accent:#e0a93f; --accent-ink:#1b1306;
  --good:#62bf8c; --bad:#e2766c;
  --display:'Instrument Serif',Georgia,'Times New Roman',serif;
  --body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f6f1e7; --surface:#fffdf8; --surface-2:#efe8da; --line:#ddd2bd;
    --fg:#1c1813; --muted:#6a6256; --accent:#a87614; --accent-ink:#ffffff;
    --good:#1f7249; --bad:#b03e2f;
    color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg:#f6f1e7; --surface:#fffdf8; --surface-2:#efe8da; --line:#ddd2bd;
  --fg:#1c1813; --muted:#6a6256; --accent:#a87614; --accent-ink:#ffffff;
  --good:#1f7249; --bad:#b03e2f;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0e0c0a; --surface:#171310; --surface-2:#211b16; --line:#33291f;
  --fg:#f1e9dc; --muted:#a69c8c; --accent:#e0a93f; --accent-ink:#1b1306;
  --good:#62bf8c; --bad:#e2766c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--fg); font:400 1rem/1.55 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:20px 56px;
}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,p,dl,dd,fieldset,legend{margin:0;padding:0}
fieldset{border:0;min-width:0}
.wrap{max-width:68rem;margin:0 auto;display:grid;gap:1.75rem}
#app{display:grid;gap:1.5rem;min-width:0;align-content:start}
.stack{display:grid;gap:1.1rem;align-content:start}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:.75rem 1rem}
.brand{display:flex;align-items:center;gap:.55rem;color:var(--fg);text-decoration:none}
.brand b{font:italic 400 2rem/1 var(--display)}
.brand span{font:600 .66rem var(--mono);letter-spacing:.12em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:.15rem .4rem}
.tabs{justify-self:center;display:flex;gap:.2rem;padding:.25rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;max-width:100%;overflow-x:auto}
.tab{border:0;background:none;color:var(--muted);padding:.5rem 1.05rem;border-radius:999px;font:600 .875rem var(--body);cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:640px){
  .top{grid-template-columns:1fr auto}
  .tabs{grid-column:1/-1;order:3;justify-self:stretch}
  .tab{flex:1;padding-inline:.4rem}
}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;font:600 .9375rem var(--body);padding:.7rem 1.1rem;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{background:none}
.btn.sm{padding:.4rem .75rem;font-size:.8125rem}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.badge{font:600 .75rem var(--mono);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:.05rem .5rem;color:var(--muted)}
.link{background:none;border:0;color:var(--accent);font:600 .875rem var(--body);cursor:pointer;padding:.1rem .45rem}
.link:hover{text-decoration:underline}
.field{display:grid;gap:.45rem;align-content:start}
.lbl{font:600 .72rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hint{font-size:.9rem;color:var(--muted)}
.row{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.row.tight{gap:.25rem .75rem}
.inp{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;font:500 1rem var(--mono)}
.inp[type="text"]{font-family:var(--body)}
.inp:focus-visible{outline-offset:0;border-color:var(--accent)}
.fields2{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:1rem}
.fields3{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:1rem}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:.8rem 2.4rem .8rem .9rem;font:600 1rem var(--body);cursor:pointer}
.sel select:focus-visible{outline-offset:0;border-color:var(--accent)}
.sel::after{content:"";position:absolute;right:1.05rem;top:50%;width:.45rem;height:.45rem;border:solid var(--muted);border-width:0 2px 2px 0;transform:translateY(-70%) rotate(45deg);pointer-events:none}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg)}
.seg button{border:0;background:none;color:var(--muted);padding:.6rem 1.1rem;font:600 .875rem var(--body);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink)}
.pills{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:.25rem;padding:.35rem;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.pills button{display:flex;align-items:center;justify-content:center;gap:.5rem;border:0;background:none;color:var(--muted);padding:.8rem .5rem;border-radius:999px;font:600 1.05rem var(--body);cursor:pointer;min-width:0}
.pills button:hover{color:var(--fg)}
.pills svg{width:1.15rem;height:1.15rem;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pills button[aria-checked="true"]{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 35%,transparent)}
@media (max-width:460px){.pills button{font-size:.9rem;padding:.75rem .2rem}.pills svg{display:none}}
.chips{display:flex;flex-wrap:wrap;gap:.45rem}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--muted);border-radius:999px;padding:.4rem .9rem;font:600 .8125rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 14%,var(--bg))}
.switches{display:grid}
.switch{display:flex;gap:.85rem;align-items:flex-start;padding:.8rem 0;border-top:1px solid var(--line);cursor:pointer}
.switch b{display:block;font-weight:600;font-size:.95rem}
.switch small{display:block;color:var(--muted);font-size:.85rem;line-height:1.4}
.tg{appearance:none;-webkit-appearance:none;flex:none;width:2.5rem;height:1.45rem;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;cursor:pointer;margin:.1rem 0 0}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:1.05rem;height:1.05rem;border-radius:50%;background:var(--muted);transition:transform .15s}
.tg:checked{background:var(--accent);border-color:var(--accent)}
.tg:checked::after{transform:translateX(1.05rem);background:var(--accent-ink)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.25rem;min-width:0}
h1{font:400 clamp(2.3rem,6.2vw,3.7rem)/1.02 var(--display);text-wrap:balance}
h1 em{color:var(--accent)}
h1.h1s{font-size:clamp(2rem,5vw,2.6rem)}
h2{font:400 1.6rem/1.15 var(--display);text-wrap:balance}
h2.q-h{font:700 1.15rem/1.3 var(--body)}
h3{font:600 1rem var(--body)}
.eyebrow{font:600 .72rem var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.lede{color:var(--muted);max-width:38rem}
.page-h{display:grid;gap:.5rem}
.banner{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;border:1px dashed var(--accent);border-radius:12px;padding:.8rem 1rem;font-size:.9rem}
.banner p{min-width:0}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:1.75rem;align-items:center}
.hero-t{display:grid;gap:.9rem}
@media (max-width:820px){.hero{grid-template-columns:1fr}}
.cont{display:grid;gap:.75rem;border-color:var(--accent)}
.cont h2{font-size:1.5rem}
.bar{height:.5rem;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:999px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(8rem,1fr));gap:.6rem}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.9rem 1rem}
.kpi b{display:block;font:400 2.4rem/1.1 var(--display)}
.kpi span{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.kpi.good b{color:var(--good)}.kpi.bad b{color:var(--bad)}.kpi.acc b{color:var(--accent)}
.two{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:1.25rem;align-items:start}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(4.4rem,1fr));gap:.5rem}
.tile{display:grid;gap:.15rem;justify-items:start;padding:.55rem .65rem;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer;text-align:left}
.tile b{font:400 1.55rem/1 var(--display)}
.tile span{font:600 .72rem var(--mono);color:var(--muted)}
.tile.l1{background:color-mix(in srgb,var(--bad) 20%,var(--surface))}
.tile.l2{background:color-mix(in srgb,var(--accent) 22%,var(--surface))}
.tile.l3{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.tile.l3 span{color:var(--accent-ink);opacity:.85}
.tile[aria-pressed="true"]{outline:2px solid var(--fg);outline-offset:2px}
.tkey{display:flex;flex-wrap:wrap;gap:.4rem 1rem;font-size:.78rem;color:var(--muted)}
.tkey span{display:inline-flex;align-items:center;gap:.4rem}
.tkey i{width:.8rem;height:.8rem;border-radius:3px;display:inline-block;border:1px solid var(--line)}
.tcap{display:flex;align-items:center;justify-content:space-between;gap:.75rem 1rem;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:.9rem}
.tcap p{min-width:0;flex:1 1 16rem}
.tcap b{color:var(--accent);font-weight:600}
.gl{stroke:var(--line);stroke-width:1}
.tx{fill:var(--muted);font:11px var(--mono)}
.ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round}
.ar{fill:var(--accent);opacity:.13}
.dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart{width:100%;height:auto;display:block}
.heatbox{overflow-x:auto;padding-bottom:.25rem}
.heat{display:grid;grid-template-rows:repeat(7,14px);grid-auto-flow:column;grid-auto-columns:14px;gap:3px;width:max-content}
.heat i{display:block;border-radius:3px;background:var(--surface-2)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 28%,var(--surface-2))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 50%,var(--surface-2))}
.heat i.l3{background:color-mix(in srgb,var(--accent) 75%,var(--surface-2))}
.heat i.l4{background:var(--accent)}
.legend{display:flex;align-items:center;gap:.35rem;font-size:.75rem;color:var(--muted)}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--surface-2)}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 6rem 3.2rem;gap:.75rem;align-items:center;font-size:.875rem;background:none;border:0;width:100%;text-align:left;cursor:pointer;padding:.35rem 0;border-radius:6px}
.prow:hover .nm{color:var(--accent)}
.prow .nm{min-width:0;overflow-wrap:anywhere}
.prow .v{font:600 .8rem var(--mono);text-align:right}
.tablebox{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.875rem}
th{font:600 .7rem var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:.4rem .6rem .4rem 0;white-space:nowrap}
td{padding:.55rem .6rem .55rem 0;border-top:1px solid var(--line);white-space:nowrap}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* practice setup */
.setup-grid{display:grid;grid-template-columns:minmax(0,1fr) 20rem;gap:1.25rem;align-items:start}
@media (max-width:900px){.setup-grid{grid-template-columns:1fr}}
.summary{position:sticky;top:1rem}
@media (max-width:900px){.summary{position:static}}
.summary .big{display:flex;align-items:baseline;gap:.5rem;flex-wrap:wrap}
.summary .big b{font:400 4rem/1 var(--display);color:var(--accent)}
.summary .big span{color:var(--muted)}
.dl{display:grid;gap:.4rem;font-size:.9rem}
.dl div{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding-top:.4rem}
.dl dt{color:var(--muted)}
.dl dd{text-align:right;min-width:0;overflow-wrap:anywhere}
.two-btns{display:grid;gap:.5rem}
.two-btns .btn{justify-content:space-between}
.sep{border:0;border-top:1px solid var(--line);margin:0;width:100%}
.tlist{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
.trow+.trow{border-top:1px solid var(--line)}
.trow-h{display:flex;align-items:center;gap:.5rem;padding:.2rem .9rem .2rem .4rem}
.trow-h:hover{background:color-mix(in srgb,var(--accent) 6%,var(--bg))}
.chev{flex:none;width:2rem;height:2.4rem;display:grid;place-items:center;background:none;border:0;color:var(--muted);cursor:pointer;border-radius:8px}
.chev svg{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .15s}
.chev[aria-expanded="true"] svg{transform:rotate(90deg)}
.trow-t{flex:1;min-width:0;padding:.7rem 0;font:700 1rem/1.35 var(--body);cursor:pointer;overflow-wrap:anywhere}
.cnt{flex:none;font:600 .72rem var(--mono);color:var(--muted)}
.cb{appearance:none;-webkit-appearance:none;flex:none;width:1.35rem;height:1.35rem;border:2px solid var(--line);border-radius:6px;background:var(--surface);position:relative;cursor:pointer;margin:0}
.cb:checked{background:var(--accent);border-color:var(--accent)}
.cb:checked::after{content:"";position:absolute;left:.38rem;top:.12rem;width:.3rem;height:.62rem;border:solid var(--accent-ink);border-width:0 2px 2px 0;transform:rotate(45deg)}
.trow-d{padding:.1rem 1rem .8rem 3rem;display:flex;align-items:center;gap:.5rem 1rem;flex-wrap:wrap;font-size:.875rem;color:var(--muted)}

/* session */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(6.5rem,1fr));gap:.5rem}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:.6rem .85rem}
.stat b{display:block;font:600 1.3rem/1.3 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.qcard{display:grid;gap:1.25rem;scroll-margin-top:5rem}
.vert>.stats{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:.5rem}
.qmeta{display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap;font:500 .8rem var(--mono);color:var(--muted)}
.qmeta>span{min-width:0}
.qtext{font:400 clamp(1.4rem,3.4vw,1.9rem)/1.3 var(--display);text-wrap:pretty}
.opts{display:grid;gap:.6rem}
.opt{display:flex;align-items:flex-start;gap:.9rem;text-align:left;width:100%;padding:.85rem 1rem;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);cursor:pointer;font:500 1rem/1.4 var(--body)}
.opt:hover:not(:disabled):not(.ro){border-color:var(--accent)}
.opt .L{flex:none;display:grid;place-items:center;width:1.7rem;height:1.7rem;border-radius:6px;border:1px solid var(--line);font:600 .8rem var(--mono);color:var(--muted)}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.opt.sel .L{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.opt.good{border-color:var(--good);background:color-mix(in srgb,var(--good) 14%,var(--surface))}
.opt.good .L{background:var(--good);color:var(--bg);border-color:transparent}
.opt.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--surface))}
.opt.bad .L{background:var(--bad);color:var(--bg);border-color:transparent}
.opt:disabled,.opt.ro{cursor:default}
.opt:disabled:not(.good):not(.bad){opacity:.7}
.expl{border-top:1px dashed var(--line);padding-top:1rem;display:grid;gap:.4rem}
.expl p{max-width:46rem}
.bm{display:inline-flex;align-items:center;gap:.4rem;background:none;border:1px solid var(--line);border-radius:8px;padding:.3rem .65rem;color:var(--muted);font:600 .78rem var(--body);cursor:pointer}
.bm[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.bm svg{width:.9rem;height:.9rem;fill:none;stroke:currentColor;stroke-width:2}
.bm[aria-pressed="true"] svg{fill:currentColor}
.navrow{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.navrow .sp{flex:1}
.confirm{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;border:1px solid var(--accent);border-radius:10px;padding:.7rem 1rem;background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.qg{display:flex;flex-wrap:wrap;gap:.35rem}
.qg button{width:2.1rem;height:2.1rem;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font:600 .75rem var(--mono);cursor:pointer}
.qg button.a{border-color:var(--accent);color:var(--fg)}
.qg button.g{background:color-mix(in srgb,var(--good) 25%,var(--surface));border-color:var(--good);color:var(--fg)}
.qg button.b{background:color-mix(in srgb,var(--bad) 25%,var(--surface));border-color:var(--bad);color:var(--fg)}
.qg button[aria-current="true"]{outline:2px solid var(--fg);outline-offset:1px}
.keys{font-size:.8125rem;color:var(--muted)}
kbd{font:600 .72rem var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:.05rem .35rem;background:var(--surface)}
.rev{display:grid;gap:1rem}
.rev .card{display:grid;gap:.9rem}
.tag{font:600 .7rem var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:.1rem .5rem;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.tag.good{color:var(--good);border-color:var(--good)}.tag.bad{color:var(--bad);border-color:var(--bad)}
.empty{display:grid;gap:.75rem;justify-items:start}
.foot{font-size:.8125rem;color:var(--muted);border-top:1px solid var(--line);padding-top:1rem;max-width:46rem}
.range{width:100%;accent-color:var(--accent)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <a class="brand" href="#home" aria-label="Pasty, go to home">
      <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20C4 10 10 4 20 4c0 10-6 16-16 16z" fill="var(--accent)"/><path d="M4 20 14 10" stroke="var(--bg)" stroke-width="1.6" stroke-linecap="round" fill="none"/></svg>
      <b>Pasty</b><span>IGCSE 0610</span>

/* ---------- session ---------- */
function buildQ(q,rep){
  const opts=shuffle([{t:q.a,ok:true}].concat(q.w.map(t=>({t,ok:false}))));
  return {id:q.id,t:q.t,q:q.q,e:q.e,opts,pick:null,locked:false,recorded:false,rep:!!rep,showE:false,pl:PAPERS[q.pp].label};
}
function begin(cfg){
  if(!cfg.ids.length)return;
  if(S.demo&&!cfg.spectate)resetProgress();
  sess={cfg,qs:cfg.ids.map(id=>buildQ(BANK[id])),i:0,mode:cfg.mode,instant:cfg.instant,spectate:cfg.spectate,limit:cfg.limit,t0:Date.now(),label:cfg.label,confirm:false};
  result=null;S.paused=null;save();
  clearInterval(timer);timer=setInterval(tick,1000);
  render();window.scrollTo(0,0);
}
function tick(){
  if(!sess){clearInterval(timer);return;}
  const el=Math.floor((Date.now()-sess.t0)/1000),e=$('#st-el');
  if(e)e.textContent=fmt(el);
  if(sess.limit){const l=$('#st-left');if(l)l.textContent=fmt(sess.limit-el);if(sess.limit-el<=0)finish(true);}
}
const isRev=(s,q)=>s.spectate||(s.instant&&q.locked);
function snap(){
  if(!sess||sess.spectate)return;
  S.paused={cfg:sess.cfg,qs:sess.qs,i:sess.i,mode:sess.mode,instant:sess.instant,spectate:sess.spectate,limit:sess.limit,el:Math.floor((Date.now()-sess.t0)/1000),label:sess.label};
  save();
}
function record(q){
  if(q.recorded||q.pick==null)return;
  q.recorded=true;
  const ok=q.opts[q.pick].ok;
  if(q.rep){if(ok)S.wrong=S.wrong.filter(i=>i!==q.id);save();return;}
  const a=S.answers[q.id]||{c:0,w:0,last:1,t:0};
  if(ok)a.c++;else a.w++;
  a.last=ok?1:0;a.t=Date.now();S.answers[q.id]=a;
  const dk=dayKey();S.days[dk]=(S.days[dk]||0)+1;
  if(ok)S.wrong=S.wrong.filter(i=>i!==q.id);else if(S.wrong.indexOf(q.id)<0)S.wrong.push(q.id);
  save();
}
function queueRepeat(q){
  if(!S.settings.repeat||sess.mode==='timed'||sess.spectate)return;
  const pending=sess.qs.some((x,j)=>j>sess.i&&x.id===q.id&&x.rep&&x.pick==null);
  if(!pending)sess.qs.push(buildQ(BANK[q.id],true));
}
function toggleBm(id){
  const i=S.bookmarks.indexOf(id);
  if(i>=0)S.bookmarks.splice(i,1);else S.bookmarks.push(id);
  save();render();
}
const BMSVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>';

function qHTML(x,j){
  const s=sess,n=s.qs.length,rev=isRev(s,x);
  const opts=x.opts.map((o,k)=>{
    let cls='opt',mark=String.fromCharCode(65+k);
    if(rev){if(o.ok){cls+=' good';mark='✓';}else if(x.pick===k){cls+=' bad';mark='✕';}}
    else if(x.pick===k)cls+=' sel';
    return '<button class="'+cls+'" data-act="pick" data-qi="'+j+'" data-k="'+k+'"'+(rev?' disabled':'')+'><span class="L">'+mark+'</span><span>'+esc(o.t)+'</span></button>';
  }).join('');
  let expl='';
  if(rev){
    if(s.instant&&!s.spectate&&S.settings.tap&&!x.showE)expl='<button class="btn" data-act="showe" data-qi="'+j+'">Show explanation</button>';
    else expl='<div class="expl"><span class="lbl">Explanation</span><p>'+esc(x.e)+'</p></div>';
  }
  return '<div class="card qcard" id="q-'+j+'"><div class="qmeta"><span>Question '+(j+1)+' of '+n+(x.rep?' · repeat':'')+' · Topic '+x.t+' · '+esc(TOPICS[x.t-1])+(s.cfg.source==='past'?' · '+esc(x.pl):'')+'</span>'+
    '<button class="bm" data-act="bm" data-id="'+x.id+'" aria-pressed="'+(S.bookmarks.indexOf(x.id)>=0)+'">'+BMSVG+'Bookmark</button></div>'+
    '<h2 class="qtext">'+esc(x.q)+'</h2><div class="opts">'+opts+'</div>'+expl+'</div>';
}
function renderSession(){
  const s=sess,n=s.qs.length,first=s.qs.filter(x=>!x.rep),vert=S.settings.layout==='vertical',y=window.scrollY;
  const rec=first.filter(x=>x.recorded&&x.pick!=null);
  const c=rec.filter(x=>x.opts[x.pick].ok).length,w=rec.length-c;
  const answered=s.qs.filter(x=>x.pick!=null).length;
  const el=Math.floor((Date.now()-s.t0)/1000);
  let stats=(s.instant&&!s.spectate)
    ?'<div class="stat"><b>'+c+'</b><span>correct</span></div><div class="stat"><b>'+w+'</b><span>wrong</span></div><div class="stat"><b>'+(c+w?pct(c/(c+w)):'0%')+'</b><span>accuracy</span></div>'
    :'<div class="stat"><b>'+answered+'/'+n+'</b><span>answered</span></div>';
  stats+='<div class="stat"><b id="st-el">'+fmt(el)+'</b><span>elapsed</span></div>';
  if(s.limit)stats+='<div class="stat"><b id="st-left">'+fmt(s.limit-el)+'</b><span>left</span></div>';
  const qg=s.qs.map((x,j)=>{
    let cl='';
    if(isRev(s,x)&&x.pick!=null)cl=x.opts[x.pick].ok?'g':'b';else if(x.pick!=null)cl='a';
    return '<button class="'+cl+'" data-act="goto" data-i="'+j+'" aria-label="Question '+(j+1)+'"'+(!vert&&j===s.i?' aria-current="true"':'')+'>'+(j+1)+'</button>';
  }).join('');
  const un=first.filter(x=>x.pick==null).length;
  const conf=s.confirm?'<div class="confirm" role="alert"><span>'+un+' unanswered. Submit anyway?</span><button class="btn primary sm" data-act="finish2">Submit</button><button class="btn sm" data-act="cancelfin">Keep going</button></div>':'';
  const fin=s.spectate?'<button class="btn primary" data-act="finish">Close</button>'
    :'<button class="btn ghost" data-act="pause">Done for now</button><button class="btn primary" data-act="finish">'+(s.mode==='timed'?'Submit exam':'Finish set')+'</button>';
  const body=vert?s.qs.map((x,j)=>qHTML(x,j)).join(''):qHTML(s.qs[s.i],s.i);
  const nav=vert?'<div class="navrow"><span class="sp"></span>'+fin+'</div>'
    :'<div class="navrow"><button class="btn" data-act="prev"'+(s.i===0?' disabled':'')+'>Previous</button><button class="btn" data-act="next"'+(s.i===n-1?' disabled':'')+'>Next</button><span class="sp"></span>'+fin+'</div>';
  const keys=vert?'':'<p class="keys"><kbd>1</kbd>–<kbd>4</kbd> or <kbd>A</kbd>–<kbd>D</kbd> answer &middot; <kbd>Enter</kbd> next &middot; <kbd>←</kbd> <kbd>→</kbd> move &middot; <kbd>Shift</kbd>+<kbd>B</kbd> bookmark</p>';
  $('#app').innerHTML=
  '<section class="stack'+(vert?' vert':'')+'"><div class="stats">'+stats+'</div>'+body+conf+nav+
  '<div class="qg" role="group" aria-label="Question navigator">'+qg+'</div>'+keys+'</section>';
  if(vert)window.scrollTo(0,y);
  snap();
}
function finish(auto){
  if(!sess)return;
  const s=sess;clearInterval(timer);
  if(s.spectate){sess=null;go('practice');return;}
  const first=s.qs.filter(x=>!x.rep);
  first.forEach(record);
  const correct=first.filter(x=>x.pick!=null&&x.opts[x.pick].ok).length;
  const wrong=first.filter(x=>x.pick!=null&&!x.opts[x.pick].ok).length;
  const secs=Math.min(Math.floor((Date.now()-s.t0)/1000),s.limit||1e9);
  if(correct+wrong>0){
    S.sessions.push({ts:Date.now(),mode:s.mode,label:s.label,n:first.length,correct,wrong,secs,topics:[...new Set(first.map(x=>x.t))]});
    if(S.sessions.length>120)S.sessions=S.sessions.slice(-120);
  }
  S.paused=null;save();
  result={cfg:s.cfg,items:first,correct,wrong,skipped:first.length-correct-wrong,secs,timedOut:!!auto,filter:'all'};
  sess=null;render();window.scrollTo(0,0);
}

/* ---------- results ---------- */
function renderResult(){
  const r=result,t=r.correct+r.wrong;
  const items=r.items.filter(x=>{
    if(r.filter==='wrong')return x.pick!=null&&!x.opts[x.pick].ok;
    if(r.filter==='right')return x.pick!=null&&x.opts[x.pick].ok;
    if(r.filter==='skipped')return x.pick==null;
    return true;
  });
  const rows=items.map(x=>{
    const ok=x.pick!=null&&x.opts[x.pick].ok,tag=x.pick==null?'<span class="tag">Skipped</span>':(ok?'<span class="tag good">Correct</span>':'<span class="tag bad">Wrong</span>');
    const idx=r.items.indexOf(x)+1;
    const os=x.opts.map((o,k)=>{
      let cls='opt ro',mark=String.fromCharCode(65+k);

      return '<div class="'+cls+'"><span class="L">'+mark+'</span><span>'+esc(o.t)+'</span></div>';
    }).join('');
    return '<article class="card"><div class="qmeta"><span>Q'+idx+' · Topic '+x.t+' · '+esc(TOPICS[x.t-1])+'</span><span class="navrow">'+tag+
      '<button class="bm" data-act="bm" data-id="'+x.id+'" aria-pressed="'+(S.bookmarks.indexOf(x.id)>=0)+'">'+BMSVG+'Bookmark</button></span></div>'+
      '<h3 class="qtext" style="font-weight:400">'+esc(x.q)+'</h3><div class="opts">'+os+'</div><div class="expl"><span class="lbl">Explanation</span><p>'+esc(x.e)+'</p></div></article>';
  }).join('');
  const fl=[['all','All'],['wrong','Wrong'],['right','Correct'],['skipped','Skipped']].map(f=>'<button class="chip" aria-pressed="'+(r.filter===f[0])+'" data-act="filter" data-v="'+f[0]+'">'+f[1]+'</button>').join('');
  $('#app').innerHTML=

  '<div class="kpis"><div class="kpi good"><b>'+r.correct+'</b><span>correct</span></div><div class="kpi bad"><b>'+r.wrong+'</b><span>wrong</span></div>'+
    '<div class="kpi"><b>'+r.skipped+'</b><span>skipped</span></div><div class="kpi acc"><b>'+(t?pct(r.correct/t):'0%')+'</b><span>accuracy</span></div><div class="kpi"><b>'+fmt(r.secs)+'</b><span>time taken</span></div></div>'+
  '<div class="navrow"><button class="btn primary" data-act="rwrong"'+(r.wrong?'':' disabled')+'>Practice wrong answers</button><button class="btn" data-act="retry">Try again</button><button class="btn ghost" data-act="tohome">Back to home</button></div>'+
  '<section class="rev"><div class="row"><h2>Review every question</h2><div class="chips">'+fl+'</div></div>'+(rows||'<p class="hint">No questions match this filter.</p>')+'</section>';

function renderHome(){

  const hist=S.sessions.slice().reverse(),shown=histAll?hist.slice(0,30):hist.slice(0,6);
  const weak=TOPICS.map((name,i)=>({n:i+1,name,s:tStats(i+1)})).filter(x=>x.s.ans>0).sort((a,b)=>a.s.acc-b.s.acc).slice(0,5);
  const weakH=weak.length?weak.map(x=>'<button class="prow" data-act="tpractice" data-t="'+x.n+'"><span class="nm">'+x.n+'. '+esc(x.name)+'</span><span class="bar"><i style="width:'+Math.round(x.s.acc*100)+'%"></i></span><span class="v">'+pct(x.s.acc)+'</span></button>').join(''):'<p class="hint">Topics you have attempted appear here, weakest first.</p>';
  const table=shown.length?'<div class="tablebox"><table><thead><tr><th>Date</th><th>Set</th><th>Mode</th><th>Score</th><th>Time</th></tr></thead><tbody>'+shown.map(s=>
    '<tr><td>'+new Date(s.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</td><td>'+esc(s.label)+'</td><td>'+esc(s.mode)+'</td><td class="num">'+s.correct+'/'+s.n+' ('+pct(sessAcc(s))+')</td><td class="num">'+fmt(s.secs)+'</td></tr>').join('')+'</tbody></table></div>'+
    (hist.length>6?'<button class="link" data-act="histmore">'+(histAll?'Show fewer':'See more')+'</button>':''):'<p class="hint">Your finished sessions will be listed here.</p>';
  $('#app').innerHTML=
  '<section class="hero"><div class="hero-t"><p class="eyebrow">'+(nm?'Welcome back, '+esc(nm):'Cambridge IGCSE Biology 0610')+'</p>'+
    '<h1>Practise by topic. <em>Know where you stand.</em></h1>'+
    '<p class="lede">Work through the 21 syllabus topics or sit past-paper style sets, with instant correction and a clear view of what to revise next.</p>'+
    '<p class="mono hint">'+(sk?sk+'-day streak · '+today+' answered today':'Answer 5 questions today to start a streak')+'</p></div>'+contCard()+'</section>'+
  (S.demo?'<div class="banner"><span>You are viewing <b>sample progress</b>. Starting a real session clears it.</span><button class="btn sm" data-act="cleardemo">Clear sample data</button></div>':'')+
  '<div class="kpis"><div class="kpi"><b>'+sk+'</b><span>day streak</span></div><div class="kpi"><b>'+tot+'</b><span>total answers</span></div><div class="kpi"><b>'+S.sessions.length+'</b><span>sessions</span></div><div class="kpi acc"><b>'+(tot?pct(cor/tot):'—')+'</b><span>overall accuracy</span></div></div>'+
  '<section class="card stack"><div><h2>Topic map</h2><p class="hint">Topics 1 to 21. Tap a tile for its detail.</p></div>'+tilesHTML()+
    '<div class="tkey"><span><i style="background:var(--surface-2)"></i>Not started</span><span><i style="background:color-mix(in srgb,var(--bad) 20%,var(--surface))"></i>Under 50%</span><span><i style="background:color-mix(in srgb,var(--accent) 22%,var(--surface))"></i>In progress</span><span><i style="background:var(--accent)"></i>Strong</span></div>'+
    '<div class="tcap" id="tcap" aria-live="polite">'+tcapHTML()+'</div>'+
    (!S.sessions.length&&!S.demo?'<div class="banner"><span>No progress yet. Answer a set, or preview this page with sample progress.</span><button class="btn sm" data-act="seed">Preview with sample progress</button></div>':'')+'</section>'+
  '<div class="two"><section class="card stack"><h2>Accuracy</h2><p class="hint">Last 20 sessions, percent correct</p>'+accChart()+'</section>'+
  '<section class="card stack"><h2>Activity pulse</h2><p class="hint">One square is one day</p>'+heatHTML()+'</section></div>'+
  '<div class="two"><section class="card stack"><h2>Needs attention</h2>'+weakH+'</section><section class="card stack"><h2>Session history</h2>'+table+'</section></div>';
}
function seedDemo(){
  resetProgress();S.demo=true;
  const base={},now=Date.now();
  ALLT.forEach(t=>{base[t]=0.35+Math.random()*0.55;});
  for(let d=27;d>=0;d--){
    if(d>0&&Math.random()<0.35)continue;
    const ts=now-d*864e5-Math.random()*2e7,n=6+Math.floor(Math.random()*10),tp={};let c=0;
    for(let i=0;i<n;i++){
      const q=BANK[Math.floor(Math.random()*BANK.length)],ok=Math.random()<Math.min(0.97,base[q.t]+(27-d)*0.004);
      const a=S.answers[q.id]||{c:0,w:0,last:1,t:0};
      if(ok){a.c++;c++;}else a.w++;
      a.last=ok?1:0;a.t=ts;S.answers[q.id]=a;tp[q.t]=1;
    }
    const dk=dayKey(new Date(ts));S.days[dk]=(S.days[dk]||0)+n;
    S.sessions.push({ts,mode:['training','shuffle','timed'][Math.floor(Math.random()*3)],label:'Sample set',n,correct:c,wrong:n-c,secs:Math.floor(n*(40+Math.random()*40)),topics:Object.keys(tp).map(Number)});
  }
  S.wrong=Object.keys(S.answers).filter(k=>S.answers[k].last===0).map(Number);
  S.bookmarks=shuffle(BANK.map(q=>q.id)).slice(0,3);
  save();
}

/* ---------- saved ---------- */
function renderSaved(){
  const items=S.bookmarks.map(id=>BANK[id]).filter(Boolean);
  $('#app').innerHTML=
  '<section class="page-h"><p class="eyebrow">Your bookmark library</p><h1 class="h1s">Saved questions</h1><p class="lede">Questions you flagged during a session. Press <kbd>Shift</kbd>+<kbd>B</kbd> while answering, or use the Bookmark button.</p></section>'+
  '<div class="navrow"><button class="btn primary" data-act="startmarks"'+(items.length?'':' disabled')+'>Practice my bookmarks</button><span class="mono hint">'+items.length+' saved</span></div>'+
  (items.length?'<div class="rev">'+items.map(q=>{
    const open=!!showAns[q.id];
    return '<article class="card"><div class="qmeta"><span>Topic '+q.t+' · '+esc(TOPICS[q.t-1])+'</span><button class="bm" data-act="unbm" data-id="'+q.id+'" aria-pressed="true">'+BMSVG+'Remove</button></div>'+
      '<h3 class="qtext" style="font-weight:400">'+esc(q.q)+'</h3>'+
      (open?'<div class="expl"><span class="lbl">Answer</span><p><b>'+esc(q.a)+'</b></p><p>'+esc(q.e)+'</p></div><button class="link" data-act="reveal" data-id="'+q.id+'">Hide answer</button>':'<button class="btn" data-act="reveal" data-id="'+q.id+'">Show answer</button>')+'</article>';}).join('')+'</div>'
  :'<section class="card empty"><h2>Nothing saved yet</h2><p class="lede">Bookmark a question during practice and it will wait for you here.</p><button class="btn primary" data-act="topractice">Start a set</button></section>');
}

/* ---------- settings ---------- */
function renderSettings(){
  const s=S.settings;
  $('#app').innerHTML=
  '<section class="page-h"><p class="eyebrow">Your space, your rules</p><h1 class="h1s">Settings</h1></section>'+
  '<div class="two"><div class="card stack"><h2>You and appearance</h2>'+
    '<label class="field"><span class="lbl">Display name</span><input class="inp" type="text" id="name" maxlength="30" autocomplete="off" data-bind="name" value="'+esc(s.name)+'" placeholder="Shown on the home page"></label>'+
    '<div class="field"><span class="lbl" id="lbl-theme">Theme</span><div class="seg" role="radiogroup" aria-labelledby="lbl-theme">'+
      [['system','Auto'],['light','Light'],['dark','Dark']].map(t=>'<button role="radio" aria-checked="'+(s.theme===t[0])+'" data-act="theme" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div></div>'+
    '<label class="field"><span class="lbl">Font size: <span id="fsv">'+s.font+'%</span></span><input class="range" type="range" id="fs" min="85" max="130" step="5" value="'+s.font+'" data-bind="font"></label></div>'+
  '<div class="card stack"><h2>How questions behave</h2>'+
    '<div class="field"><span class="lbl" id="lbl-layout">Question view</span><div class="seg" role="radiogroup" aria-labelledby="lbl-layout">'+
      [['vertical','Vertical'],['horizontal','Horizontal']].map(t=>'<button role="radio" aria-checked="'+((s.layout||'horizontal')===t[0])+'" data-act="layout" data-v="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+
      '<p class="hint">'+((s.layout||'horizontal')==='vertical'?'Vertical puts every question of a set in one scrolling list, like a paper.':'Horizontal shows one question at a time with Previous and Next buttons.')+'</p></div>'+
    '<div class="switches">'+
    '<label class="switch"><input class="tg" type="checkbox" id="s-tap" data-bind="tap"'+(s.tap?' checked':'')+'><span><b>Tap to show the explanation</b><small>After you answer, keep the explanation hidden until you tap to reveal it.</small></span></label>'+
    '<label class="switch"><input class="tg" type="checkbox" id="s-rep" data-bind="repeat"'+(s.repeat?' checked':'')+'><span><b>Repeat my mistakes in this session</b><small>A missed question is added to the end of the set and returns until you solve it. It also stays in Practice wrong answers.</small></span></label></div>'+
    '<h2>Your data</h2><p class="hint">Progress lives in this browser. '+S.wrong.length+' questions are in your wrong-answer queue.</p>'+
    '<div class="navrow">'+(confirmReset===1?'<span class="hint">Clear the wrong-answer queue?</span><button class="btn primary sm" data-act="clearwrong2">Clear it</button><button class="btn sm" data-act="cancelc">Cancel</button>':'<button class="btn" data-act="clearwrong">Clear my mistakes</button>')+'</div>'+
    '<div class="navrow">'+(confirmReset===2?'<span class="hint">This erases all progress, bookmarks and history.</span><button class="btn primary sm" data-act="reset2">Erase everything</button><button class="btn sm" data-act="cancelc">Cancel</button>':'<button class="btn" data-act="reset1">Reset all progress</button>')+'</div></div></div>';
}

/* ---------- actions ---------- */
function setOnly(key){
  if(key[0]==='t')S.setup.topics=[+key.slice(1)];else S.setup.papers=[+key.slice(1)];
}
const act={
  mode:b=>{S.setup.mode=b.dataset.v;S.setup.instant=null;save();drawMode();drawSummary();},
  src:b=>{S.setup.source=b.dataset.v;save();drawSrc();drawSel();drawSummary();},
  expand:b=>{const k=b.dataset.key;exp[k]=!exp[k];drawSel();const nb=$('[data-act="expand"][data-key="'+k+'"]');if(nb)nb.focus();},
  only:b=>{setOnly(b.dataset.key);save();drawSel();drawSummary();},
  selall:()=>{
    if(S.setup.source==='classified')S.setup.topics=ALLT.slice();
    else S.setup.papers=[...new Set(S.setup.papers.concat(visPapers().map(p=>p.id)))];
    save();drawSel();drawSummary();
  },
  selnone:()=>{
    if(S.setup.source==='classified')S.setup.topics=[];
    else{const v=visPapers().map(p=>p.id);S.setup.papers=S.setup.papers.filter(id=>v.indexOf(id)<0);}
    save();drawSel();drawSummary();
  },
  start:()=>{
    const p=pool(),st=S.setup;if(!p.length)return;
    let list=st.mode==='training'?p.slice().sort((a,b)=>a.id-b.id):shuffle(p);
    if(st.fresh){
      const seen=q=>{const a=S.answers[q.id];return a&&a.c+a.w>0?1:0;};
      list=list.map((q,i)=>[q,i]).sort((x,y)=>seen(x[0])-seen(y[0])||x[1]-y[1]).map(x=>x[0]);
    }
    list=list.slice(0,Math.min(Math.max(1,st.n),list.length));
    begin({ids:list.map(q=>q.id),mode:st.mode,source:st.source,limit:st.mode==='timed'?Math.max(1,st.mins)*60:0,instant:effInstant(),spectate:!!st.spectate,label:labelFor()});
  },
  startwrong:()=>begin({ids:shuffle(S.wrong.filter(i=>BANK[i])),mode:'training',source:'mixed',limit:0,instant:true,spectate:false,label:'Wrong answers'}),
  startmarks:()=>begin({ids:S.bookmarks.filter(i=>BANK[i]),mode:'training',source:'mixed',limit:0,instant:true,spectate:false,label:'Bookmarks'}),
  resume:()=>{
    const p=S.paused;if(!p)return;
    sess={cfg:p.cfg,qs:p.qs,i:p.i,mode:p.mode,instant:p.instant,spectate:p.spectate,limit:p.limit,t0:Date.now()-p.el*1000,label:p.label,confirm:false};
    result=null;clearInterval(timer);timer=setInterval(tick,1000);render();window.scrollTo(0,0);
  },
  discard:()=>{S.paused=null;save();render();},
  pick:b=>{
    if(!sess)return;
    const qi=b.dataset.qi!==undefined?+b.dataset.qi:sess.i,q=sess.qs[qi],k=+b.dataset.k;
    if(!q||sess.spectate||q.locked||!q.opts[k])return;
    sess.i=qi;q.pick=k;
    if(sess.instant){q.locked=true;record(q);if(!q.opts[k].ok)queueRepeat(q);}
    sess.confirm=false;render();
  },
  showe:b=>{const q=sess.qs[b.dataset.qi!==undefined?+b.dataset.qi:sess.i];if(q){q.showE=true;render();}},
  prev:()=>{if(sess.i>0){sess.i--;render();}},
  next:()=>{if(sess.i<sess.qs.length-1){sess.i++;render();}},
  goto:b=>{
    sess.i=+b.dataset.i;
    if(S.settings.layout==='vertical'){const el=document.getElementById('q-'+sess.i);if(el)el.scrollIntoView({behavior:'smooth',block:'start'});}
    else render();
  },
  layout:b=>{S.settings.layout=b.dataset.v;save();renderSettings();},
  bm:b=>toggleBm(+b.dataset.id),
  unbm:b=>toggleBm(+b.dataset.id),
  pause:()=>{snap();clearInterval(timer);sess=null;go('home');},
  finish:()=>{
    const un=sess.qs.filter(x=>!x.rep&&x.pick==null).length;
    if(un&&!sess.spectate&&!sess.confirm){sess.confirm=true;render();return;}
    finish();
  },
  finish2:()=>finish(),
  cancelfin:()=>{sess.confirm=false;render();},
  filter:b=>{result.filter=b.dataset.v;render();},
  rwrong:()=>{
    const ids=result.items.filter(x=>x.pick!=null&&!x.opts[x.pick].ok).map(x=>x.id);
    result=null;begin({ids,mode:'training',source:'mixed',limit:0,instant:true,spectate:false,label:'Wrong answers'});
  },
  retry:()=>{
    const c=result.cfg;let ids=c.ids.slice();if(c.mode!=='training')ids=shuffle(ids);
    result=null;begin(Object.assign({},c,{ids}));
  },
  tohome:()=>{result=null;go('home');},
  topractice:()=>go('practice'),
  seed:()=>{seedDemo();render();},
  cleardemo:()=>{resetProgress();render();},
  histmore:()=>{histAll=!histAll;render();},
  tile:b=>{selT=+b.dataset.t;renderHome();const t=$('[data-act="tile"][data-t="'+selT+'"]');if(t)t.focus();},
  tpractice:b=>{S.setup.source='classified';S.setup.topics=[+b.dataset.t];save();go('practice');},
  reveal:b=>{const id=b.dataset.id;showAns[id]=!showAns[id];render();},
  theme:b=>{S.settings.theme=b.dataset.v;save();applyTheme();renderSettings();},
  clearwrong:()=>{confirmReset=1;renderSettings();},
  clearwrong2:()=>{S.wrong=[];confirmReset=0;save();renderSettings();},
  reset1:()=>{confirmReset=2;renderSettings();},
  reset2:()=>{resetProgress();confirmReset=0;applyTheme();renderSettings();},
  cancelc:()=>{confirmReset=0;renderSettings();}
};
const bind={
  n:(t,type)=>{
    const v=parseInt(t.value,10);
    if(v>0){S.setup.n=v;save();drawSummary();}
    if(type==='change'){const p=pool().length||1;S.setup.n=Math.min(Math.max(1,v||S.setup.n),p);t.value=S.setup.n;save();drawSummary();}
  },
  mins:(t,type)=>{
    const v=parseInt(t.value,10);
    if(v>0){S.setup.mins=Math.min(240,v);save();drawSummary();}
    if(type==='change')t.value=S.setup.mins;
  },
  instant:t=>{S.setup.instant=t.checked;save();},
  fresh:t=>{S.setup.fresh=t.checked;save();},
  spec:t=>{S.setup.spectate=t.checked;save();},
  sel:t=>{
    const k=t.dataset.k,id=+k.slice(1),arr=k[0]==='t'?S.setup.topics:S.setup.papers,i=arr.indexOf(id);
    if(t.checked&&i<0)arr.push(id);
    if(!t.checked&&i>=0)arr.splice(i,1);
    save();updCount();
  },
  py:t=>{S.setup.py=t.value;save();drawSel();},
  ps:t=>{S.setup.ps=t.value;save();drawSel();},
  pt:t=>{S.setup.pt=t.value;save();drawSel();},
  name:t=>{S.settings.name=t.value.trim();save();},
  font:t=>{S.settings.font=+t.value;$('#fsv').textContent=t.value+'%';save();applyTheme();},
  tap:t=>{S.settings.tap=t.checked;save();},
  repeat:t=>{S.settings.repeat=t.checked;save();}
};

const app=$('#app');
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(b&&app.contains(b)&&act[b.dataset.act])act[b.dataset.act](b,e);
});
const run=(t,type)=>{const k=t.dataset&&t.dataset.bind;if(k&&bind[k])bind[k](t,type);};
app.addEventListener('input',e=>{const t=e.target;if(t.type==='checkbox'||t.tagName==='SELECT')return;run(t,'input');});
app.addEventListener('change',e=>run(e.target,'change'));
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{if(sess)return;result=null;go(b.getAttribute('data-v'));}));
$('#theme-btn').addEventListener('click',()=>{
  const order=['system','light','dark'];
  S.settings.theme=order[(order.indexOf(S.settings.theme)+1)%3];save();applyTheme();
  if(view==='settings'&&!sess&&!result)renderSettings();
});
document.addEventListener('keydown',e=>{
  if(!sess||e.ctrlKey||e.metaKey||e.altKey||S.settings.layout==='vertical')return;
  const t=e.target;if(t&&/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName))return;
  const k=e.key;
  if(e.shiftKey&&k.toLowerCase()==='b'){e.preventDefault();toggleBm(sess.qs[sess.i].id);return;}
  if(/^[1-4]$/.test(k)){act.pick({dataset:{k:+k-1}});return;}
  if(!e.shiftKey&&/^[a-dA-D]$/.test(k)){act.pick({dataset:{k:k.toLowerCase().charCodeAt(0)-97}});return;}
  if(k==='Enter'&&!(t&&t.tagName==='BUTTON')){act.next();return;}
  if(k==='ArrowRight'){act.next();return;}
  if(k==='ArrowLeft'){act.prev();return;}
});

applyTheme();
const h=location.hash.slice(1);
if(TABS.indexOf(h)>=0)view=h;
render();
})();
</script>

</body></html>
